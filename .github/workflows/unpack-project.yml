name: Repair Live2D site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing site bundles
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .upload/fix.b64 ]; then
            echo "Repair archive already applied; nothing to do."
            exit 0
          fi
          base64 --decode .upload/fix.b64 > /tmp/live2d-fix.zip
          unzip -t /tmp/live2d-fix.zip
          unzip -o /tmp/live2d-fix.zip -d .
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Live2D site bundles"
          git push
