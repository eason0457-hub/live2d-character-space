name: Repair Live2D site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore missing site bundles
        shell: bash
        run: |
          set -euo pipefail
          for part in fix00 fix01 fix02 fix03 fix04 fix05 fix06; do
            if [ ! -f ".upload/$part" ]; then
              echo "Waiting for all repair chunks. Missing: $part"
              exit 0
            fi
          done
          cat .upload/fix00 .upload/fix01 .upload/fix02 .upload/fix03 .upload/fix04 .upload/fix05 .upload/fix06 > /tmp/live2d-fix.b64
          base64 --decode /tmp/live2d-fix.b64 > /tmp/live2d-fix.zip
          unzip -t /tmp/live2d-fix.zip
          unzip -o /tmp/live2d-fix.zip -d .
          rm -rf .upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Live2D site bundles"
          git push
