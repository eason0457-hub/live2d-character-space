name: Unpack project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and import project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .upload/part00 ]; then
            echo "Project archive already imported; nothing to do."
            exit 0
          fi
          cat .upload/part00 .upload/part01 .upload/part02 | base64 --decode > /tmp/live2d-project.zip
          unzip -t /tmp/live2d-project.zip
          unzip -o /tmp/live2d-project.zip -d .
          rm -rf .upload
          rm -f .init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore bundled Live2D assets"
          git push
